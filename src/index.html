<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header class="header">
      <a
        href="/"
        class="logo"
      >
        <img
          src="images/logo.png"
          alt="Moyo logo"
        />
      </a>

      <nav class="nav">
        <ul class="nav__list">
          <li>
            <a
              class="nav__link is-active"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="#"
            >
              Accessories
            </a>
          </li>

          <li>
            <a
              class="nav__link"
              href="#"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>

          <li>
            <a
              class="nav__link"
              href="#"
            >
              Other
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
